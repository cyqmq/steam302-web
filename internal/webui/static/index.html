<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>steam302-web 控制台</title>
<style>
  :root {
    color-scheme: dark;
    --bg: #16181d; --fg: #e6e6e6;
    --border: #2a2e37; --muted: #8b93a1;
    --card: #1d2027; --desc: #9aa2b1;
    --tag: #262b34; --tag-fg: #9aa2b1;
    --warn-bg: #4a3410; --warn-fg: #f0b45a;
    --on-bg: #143a24; --on-fg: #5fd08a;
    --off-bg: #33262b; --off-fg: #d98a8a;
    --check-bg: #333844; --check-knob: #e6e6e6; --check-on: #2f7d4f;
    --btn: #2b6cb0; --btn-fg: #fff; --ghost: #2a2e37;
    --status-bg: #20242c; --status-border: #333844;
  }
  :root[data-theme="light"] {
    color-scheme: light;
    --bg: #ffffff; --fg: #1f2328;
    --border: #d0d7de; --muted: #57606a;
    --card: #f6f8fa; --desc: #57606a;
    --tag: #eaeef2; --tag-fg: #57606a;
    --warn-bg: #fff1bf; --warn-fg: #9a6700;
    --on-bg: #dafbe1; --on-fg: #1a7f37;
    --off-bg: #ffebe9; --off-fg: #cf222e;
    --check-bg: #d0d7de; --check-knob: #ffffff;
    --btn: #2b6cb0; --ghost: #eaeef2; --ghost-fg: #1f2328;
    --status-bg: #f6f8fa; --status-border: #d0d7de;
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, "Segoe UI", sans-serif; background: var(--bg); color: var(--fg); }
  header { padding: 18px 24px; border-bottom: 1px solid var(--border); display: flex; align-items: baseline; gap: 12px; }
  h1 { font-size: 18px; margin: 0; }
  header .sub { color: var(--muted); font-size: 12px; }
  header .actions { margin-left: auto; display: flex; gap: 8px; }
  main { max-width: 960px; margin: 0 auto; padding: 20px 24px 60px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); margin: 26px 0 8px; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; display: flex; gap: 12px; align-items: flex-start; }
  .card .meta { flex: 1; min-width: 0; }
  .card .name { font-weight: 600; }
  .card .desc { color: var(--desc); font-size: 12px; margin-top: 3px; }
  .card .tags { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: var(--tag); color: var(--tag-fg); }
  .tag.warn { background: var(--warn-bg); color: var(--warn-fg); }
  .tag.on { background: var(--on-bg); color: var(--on-fg); }
  .tag.off { background: var(--off-bg); color: var(--off-fg); }
  input[type=checkbox] { width: 42px; height: 22px; appearance: none; background: var(--check-bg); border-radius: 999px; position: relative; cursor: pointer; flex: none; margin-top: 2px; transition: background .15s; }
  input[type=checkbox]::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: var(--check-knob); transition: transform .15s; }
  input[type=checkbox]:checked { background: var(--check-on); }
  input[type=checkbox]:checked::after { transform: translateX(20px); }
  button { background: var(--btn); color: var(--btn-fg); border: 0; border-radius: 7px; padding: 7px 14px; cursor: pointer; font-size: 13px; }
  button.ghost { background: var(--ghost); color: var(--btn-fg); }
  :root[data-theme="light"] button.ghost { color: var(--ghost-fg); }
  #status { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: var(--status-bg); border: 1px solid var(--status-border); padding: 8px 16px; border-radius: 8px; font-size: 12px; opacity: 0; transition: opacity .2s; }
  #status.show { opacity: 1; }
  .modal-backdrop { position: fixed; inset: 0; background: rgba(0,0,0,.5); display: none; align-items: center; justify-content: center; z-index: 10; }
  .modal-backdrop.show { display: flex; }
  .modal { background: var(--card); border: 1px solid var(--border); border-radius: 12px; width: min(720px, 92vw); max-height: 86vh; overflow: auto; padding: 18px 20px 20px; }
  .modal h3 { margin: 0 0 4px; }
  .modal .hint { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
  .tabs { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
  .tabs button { background: var(--ghost); opacity: .75; padding: 5px 12px; font-size: 12px; }
  .tabs button.active { opacity: 1; }
  textarea { width: 100%; min-height: 120px; font: 12px/1.45 ui-monospace, monospace; background: var(--bg); color: var(--fg); border: 1px solid var(--border); border-radius: 8px; padding: 10px; resize: vertical; }
  .modal .row { display: flex; gap: 8px; align-items: center; margin-top: 8px; }
  .modal input[type=text], .modal input[type=number] { background: var(--tag); color: var(--fg); border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; box-sizing: border-box; min-width: 0; }
  .modal input[type=text] { width: 100%; }
  .modal input[type=number] { width: 100%; }
  .sec { margin: 16px 0 6px; font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px; border-bottom: 1px solid var(--border); padding-bottom: 4px; }
  .sec.danger { color: #d98a8a; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px 12px; }
  .grid label { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
  .grid .chk { flex-direction: row; align-items: center; gap: 8px; margin-top: 16px; }
  button.danger { background: #a93b3b; color: #fff; border: none; border-radius: 6px; padding: 8px 10px; cursor: pointer; }
  button.danger:hover { filter: brightness(1.1); }
  .modal .count { color: var(--muted); font-size: 12px; }
  button.mini { padding: 2px 9px; font-size: 12px; background: var(--ghost); }
</style>
</head>
<body>
<header>
  <h1>steam302-web</h1>
  <span class="sub" id="summary">加载中…</span>
  <span class="actions">
    <button class="ghost" id="blacklist">域名黑名单</button>
    <button class="ghost" id="profile">复制代理参数</button>
    <button class="ghost" id="theme">☾ 暗色</button>
    <button class="ghost" id="regen">重新生成配置</button>
    <button class="ghost" id="apply">一键应用</button>
    <button class="ghost" id="settings">设置</button>
  </span>
</header>
<main id="app"></main>
<div id="status"></div>
<div class="modal-backdrop" id="backdrop">
  <div class="modal">
    <h3>代理参数</h3>
    <div class="hint" id="profHint">面向客户端的接线方式（Hosts 劫持 / curl / PAC / 环境变量）。</div>
    <div class="tabs" id="tabs"></div>
    <textarea id="profTxt" spellcheck="false" readonly></textarea>
    <div class="row">
      <button id="profCopy">复制</button>
      <span class="count" id="profCount"></span>
      <button class="ghost" id="profClose" style="margin-left:auto;">关闭</button>
    </div>
  </div>
</div>
<div class="modal-backdrop" id="edBackdrop">
  <div class="modal">
    <h3 id="edTitle">编辑规则</h3>
    <div class="hint" id="edHint">修改保存后自动校验并重新生成 Caddyfile / hosts。</div>
    <textarea id="edTxt" spellcheck="false" style="min-height:260px;"></textarea>
    <div class="row">
      <button id="edSave">保存并重生成</button>
      <span class="count" id="edCount"></span>
      <button class="ghost" id="edClose" style="margin-left:auto;">关闭</button>
    </div>
  </div>
</div>
<div class="modal-backdrop" id="setBackdrop">
  <div class="modal" style="min-width:640px;">
    <h3>设置</h3>
    <div class="hint">修改后点「保存设置」写入 config/env.json；重启类操作见下方按钮。证书/自启/恢复出厂需 root（本机 webui 常以 root 运行）。</div>
    <div style="max-height:60vh;overflow:auto;padding-right:6px;">
      <div class="sec">基础</div>
      <div class="grid">
        <label>本地监听 IP <input id="stBind" type="text" placeholder="127.0.0.1"></label>
        <label>s302fwd 日志轮转(字节) <input id="stLog" type="number" min="0" step="1048576"></label>
        <label>hosts 快照保留数 <input id="stKeep" type="number" min="0" max="10000"></label>
      </div>
      <div class="sec">证书（genpki 未带参数时的默认有效期）</div>
      <div class="grid">
        <label>CA 有效期(年) <input id="stCA" type="number" min="1" max="100"></label>
        <label>叶证书有效期(天) <input id="stLeaf" type="number" min="1" max="3650"></label>
        <div class="row" style="margin-top:14px;">
          <button class="ghost" id="stResetRoot">重置根证书</button>
          <button class="ghost" id="stResetLeaf">重置网站证书</button>
          <span class="count" id="stCertInfo"></span>
        </div>
      </div>
      <div class="sec">CDN 优选（全局默认，规则内可覆盖）</div>
      <div class="grid">
        <label class="chk"><input id="stPrefEn" type="checkbox"> 启用优选</label>
        <label class="chk"><input id="stPrefSpeed" type="checkbox"> 测速</label>
        <label>限速 max_mbps <input id="stPrefMb" type="number" min="0" step="1"></label>
        <label>并行数 <input id="stPrefPar" type="number" min="1"></label>
        <label>延迟超时(ms) <input id="stPrefLt" type="number" min="100"></label>
        <label>Top N <input id="stPrefTop" type="number" min="1"></label>
        <label>每 CIDR 采样 <input id="stPrefSpl" type="number" min="1"></label>
      </div>
      <div class="sec">系统</div>
      <div class="grid">
        <label class="chk"><input id="stAuto" type="checkbox"> 开机自启（systemd）</label>
      </div>
      <div class="sec danger">危险区</div>
      <button class="danger" id="stResetFactory">恢复出厂设置（停服＋撤自启＋撤销 hosts＋清理生成物；保留规则/env）</button>
    </div>
    <div class="row" style="margin-top:12px;">
      <button id="stSave">保存设置</button>
      <span class="count" id="stCount"></span>
      <button class="ghost" id="stClose" style="margin-left:auto;">关闭</button>
    </div>
  </div>
</div>
<script>
const app = document.getElementById("app");
const status = document.getElementById("status");
let rules = [];

function applyTheme(theme) {
  if (theme !== "light") theme = "dark";
  document.documentElement.dataset.theme = theme;
  localStorage.setItem("theme", theme);
  document.getElementById("theme").textContent = theme === "light" ? "☀ 亮色" : "☾ 暗色";
}

document.getElementById("theme").onclick = () => {
  const cur = document.documentElement.dataset.theme;
  applyTheme(cur === "light" ? "dark" : "light");
};
applyTheme(localStorage.getItem("theme") || "dark");

const backdrop = document.getElementById("backdrop");
const profTxt = document.getElementById("profTxt");
const tabsEl = document.getElementById("tabs");
let profile = null, profKey = "hosts";
let profButtons = [];

function showProfile() {
  const tabs = [
    ["hosts", "Hosts 劫持"],
    ["curl", "curl 验证"],
    ["pac", "PAC"],
    ["env", "环境变量"],
  ];
  profButtons = [];
  tabsEl.innerHTML = "";
  for (const [key, label] of tabs) {
    const b = document.createElement("button");
    b.textContent = label;
    b.onclick = () => { profKey = key; renderProfile(); };
    tabsEl.appendChild(b);
    profButtons.push(b);
  }
  document.getElementById("profHint").textContent =
    `绑定 ${profile.bind_ip}，HTTPS :${profile.https_port} / HTTP :${profile.http_port}，CA ${profile.ca_exists ? "已生成" : "缺失"} (${profile.ca_path})`;
  renderProfile();
  backdrop.classList.add("show");
}

const PROF_MAP = { hosts: "hosts_txt", curl: "curl_cmd", pac: "pac", env: "env" };

function renderProfile() {
  const key = profButtons.length ? PROF_MAP[profKey] : "hosts_txt";
  profTxt.value = profile[key] || "";
  document.getElementById("profCount").textContent = `${profTxt.value.length} 字符 · ${profile.hosts.length} 个域名`;
  profButtons.forEach((b, i) => b.classList.toggle("active", ["hosts", "curl", "pac", "env"][i] === profKey));
}

document.getElementById("profile").onclick = async () => {
  try {
    profile = await api("GET", "/api/profile");
    profKey = "hosts";
    showProfile();
  } catch (e) { toast("加载失败: " + e.message); }
};
document.getElementById("profCopy").onclick = async () => {
  await navigator.clipboard.writeText(profTxt.value).catch(() => showFallbackCopy());
  toast("已复制");
};
document.getElementById("profClose").onclick = () => backdrop.classList.remove("show");
backdrop.addEventListener("click", e => { if (e.target === backdrop) backdrop.classList.remove("show"); });
function showFallbackCopy() {
  profTxt.removeAttribute("readonly");
  profTxt.select();
  document.execCommand("copy");
  profTxt.setAttribute("readonly", "");
}

function toast(msg) {
  status.textContent = msg;
  status.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => status.classList.remove("show"), 2600);
}

async function api(method, url, body) {
  const res = await fetch(url, {
    method,
    headers: body ? { "Content-Type": "application/json" } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function render() {
  const groups = {};
  for (const r of rules) (groups[r.group] ||= []).push(r);
  app.innerHTML = "";
  for (const g of Object.keys(groups).sort()) {
    const h = document.createElement("h2");
    h.textContent = g;
    app.appendChild(h);
    for (const r of groups[g]) app.appendChild(card(r));
  }
  const on = rules.filter(r => r.enabled).length;
  document.getElementById("summary").textContent =
    `${rules.length} 条规则，${on} 条启用`;
}

function card(r) {
  const el = document.createElement("div");
  el.className = "card";
  const meta = document.createElement("div");
  meta.className = "meta";
  const tags = [];
  tags.push(`<span class="tag">${r.id}</span>`);
  tags.push(`<span class="tag">${r.host_count} 域名</span>`);
  if (r.missing_files && r.missing_files.length)
    tags.push(`<span class="tag warn">缺文件 ${r.missing_files.length}</span>`);
  meta.innerHTML = `<div class="name">${r.name}</div>
    <div class="desc">${r.description || ""}</div>
    <div class="tags">${tags.join("")}</div>`;
  const cb = document.createElement("input");
  cb.type = "checkbox";
  cb.checked = r.enabled;
  cb.title = r.enabled ? "已启用" : "已关闭";
  cb.onchange = async () => {
    cb.disabled = true;
    try {
      const data = await api("POST", `/api/rules/${r.id}`, { enabled: cb.checked });
      r.enabled = cb.checked;
      const reg = data.regen || {};
      toast(`已${cb.checked ? "启用" : "关闭"} ${r.id}；重生成 ${reg.rules} 条规则，校验 ${reg.validate}`);
      render();
    } catch (e) {
      cb.checked = r.enabled;
      toast("失败: " + e.message);
    } finally {
      cb.disabled = false;
    }
  };
  const edit = document.createElement("button");
  edit.className = "mini";
  edit.textContent = "✎ 编辑";
  edit.title = "编辑规则 " + r.id;
  edit.onclick = () => openEditor(r.id);
  el.appendChild(meta);
  el.append(edit, cb);
  return el;
}

async function load() {
  try {
    const data = await api("GET", "/api/rules");
    rules = data.rules || [];
    render();
  } catch (e) {
    toast("加载失败: " + e.message);
  }
}

document.getElementById("regen").onclick = async () => {
  try {
    const data = await api("POST", "/api/regen");
    const reg = data.regen || {};
    toast(`已生成 ${reg.rules} 条规则 / ${reg.hosts} 个域名，caddy 校验 ${reg.validate}`);
  } catch (e) {
    toast("失败: " + e.message);
  }
};

document.getElementById("apply").onclick = async () => {
  try {
    const data = await api("POST", "/api/apply");
    if (data.applied) {
      toast("已应用："+ (data.out || "").trim().split("\n").pop());
    } else {
      const hint = location.origin.match(/127\.|localhost/) ? "" : "（本机提示：webui 需配 sudo -n 免密才可远程触发）";
      toast(`应用未执行：${data.error || "无 root 权限"}` + hint);
    }
  } catch (e) {
    toast("失败: " + e.message);
  }
};

const edBackdrop = document.getElementById("edBackdrop");
const edTxt = document.getElementById("edTxt");
let edMode = null, edId = null;

function openModalMode(mode) {
  edBackdrop.classList.add("show");
  edMode = mode;
  if (mode === "rule") {
    document.getElementById("edTitle").textContent = `编辑规则 ${edId}`;
    document.getElementById("edHint").textContent = "JSON 保存后自动校验并重生成；id 需与文件名一致，留空则取文件名。";
  } else {
    document.getElementById("edTitle").textContent = "域名黑名单";
    document.getElementById("edHint").textContent = "每行一个域名（支持 *.example.com），这些域名将不进入 hosts 劫持、走直连；留空 = 清空。保存后写入 S302.hosts；点顶部「一键应用」即可同步到 /etc/hosts 并重启服务。";
  }
}

async function openEditor(id) {
  try {
    const data = await api("GET", `/api/rule/${id}`);
    edId = id;
    edTxt.value = data.text;
    document.getElementById("edCount").textContent = `${edTxt.value.length} 字符`;
    openModalMode("rule");
  } catch (e) { toast("加载失败: " + e.message); }
}

async function openBlacklist() {
  try {
    const data = await api("GET", "/api/blacklist");
    edId = null;
    edTxt.value = (data.domains || []).join("\n");
    document.getElementById("edCount").textContent = `${edTxt.value.split("\n").filter(l => l.trim()).length} 个域名`;
    openModalMode("blacklist");
  } catch (e) { toast("加载失败: " + e.message); }
}

document.getElementById("blacklist").onclick = openBlacklist;
document.getElementById("edSave").onclick = async () => {
  const btn = document.getElementById("edSave");
  btn.disabled = true;
  try {
    let res;
    if (edMode === "rule") res = await api("PUT", `/api/rule/${edId}`, { text: edTxt.value });
    else {
      const domains = edTxt.value.split("\n").map(l => l.trim()).filter(Boolean);
      res = await api("PUT", "/api/blacklist", { domains });
    }
    const reg = res.regen || {};
    toast(`已保存；重生成 ${reg.rules} 条规则，caddy 校验 ${reg.validate}`);
    edBackdrop.classList.remove("show");
  } catch (e) {
    toast("保存失败: " + e.message);
  } finally {
    btn.disabled = false;
  }
};
document.getElementById("edClose").onclick = () => edBackdrop.classList.remove("show");
edBackdrop.addEventListener("click", e => { if (e.target === edBackdrop) edBackdrop.classList.remove("show"); });

// ---- 设置 ----
const setBackdrop = document.getElementById("setBackdrop");
const $s = id => document.getElementById(id);

async function loadSettings() {
  try {
    const s = await api("GET", "/api/settings");
    $s("stBind").value = s.bind_ip;
    $s("stLog").value = s.log_max_bytes;
    $s("stKeep").value = s.backup_keep;
    $s("stCA").value = s.ca_years;
    $s("stLeaf").value = s.leaf_days;
    $s("stPrefEn").checked = s.prefer.enabled;
    $s("stPrefSpeed").checked = s.prefer.speed_test;
    $s("stPrefMb").value = s.prefer.max_mbps;
    $s("stPrefPar").value = s.prefer.parallel;
    $s("stPrefLt").value = s.prefer.latency_timeout_ms;
    $s("stPrefTop").value = s.prefer.top_n;
    $s("stPrefSpl").value = s.prefer.samples_per_cidr;
    $s("stAuto").checked = s.autostart;
    $s("stCertInfo").textContent = s.cert_exists ? "证书已存在" : "证书缺失";
  } catch (e) { toast("加载设置失败: " + e.message); }
}

document.getElementById("settings").onclick = () => { setBackdrop.classList.add("show"); loadSettings(); };
$s("stClose").onclick = () => setBackdrop.classList.remove("show");
setBackdrop.addEventListener("click", e => { if (e.target === setBackdrop) setBackdrop.classList.remove("show"); });

$s("stSave").onclick = async () => {
  const btn = $s("stSave");
  btn.disabled = true;
  try {
    await api("PUT", "/api/settings", {
      bind_ip: $s("stBind").value.trim() || undefined,
      log_max_bytes: parseInt($s("stLog").value, 10) || undefined,
      backup_keep: parseInt($s("stKeep").value, 10) || undefined,
      ca_years: parseInt($s("stCA").value, 10) || undefined,
      leaf_days: parseInt($s("stLeaf").value, 10) || undefined,
      prefer: {
        enabled: $s("stPrefEn").checked,
        speed_test: $s("stPrefSpeed").checked,
        max_mbps: parseFloat($s("stPrefMb").value) || 0,
        parallel: parseInt($s("stPrefPar").value, 10) || 32,
        latency_timeout_ms: parseInt($s("stPrefLt").value, 10) || 1200,
        top_n: parseInt($s("stPrefTop").value, 10) || 2,
        samples_per_cidr: parseInt($s("stPrefSpl").value, 10) || 16,
      },
    });
    toast("设置已保存到 config/env.json");
    loadSettings();
  } catch (e) { toast("保存失败: " + e.message); } finally { btn.disabled = false; }
};

$s("stAuto").onchange = async () => {
  try {
    await api("POST", "/api/settings/autostart", { enabled: $s("stAuto").checked });
    toast($s("stAuto").checked ? "已设置开机自启" : "已取消开机自启");
  } catch (e) { toast("切换自启失败: " + e.message); loadSettings(); }
};

async function certReset(which, label) {
  if (!confirm(`确定${label}？将重新签发证书并重启代理服务。`)) return;
  try {
    const res = await api("POST", `/api/settings/certs/${which}`, {});
    toast(res.ok ? `${label}完成，服务已重载` : `${label}失败：${res.error || "见输出"}`);
    if (res.output) console.log(res.output);
  } catch (e) { toast(`${label}失败: ` + e.message); }
}

$s("stResetRoot").onclick = () => certReset("root", "重置根证书");
$s("stResetLeaf").onclick = () => certReset("leaf", "重置网站证书");

$s("stResetFactory").onclick = async () => {
  if (!confirm("恢复出厂：停止服务、取消开机自启、撤销 hosts 劫持、删除证书与生成物。规则文件与 env.json 保留。确认？"))
    return;
  if (!confirm("再次确认：将无法在面板继续操作（服务会停止），需 SSH 到本机 systemctl enable --now 恢复。"))
    return;
  try {
    const res = await api("POST", "/api/settings/reset", { confirm: true });
    toast(res.ok ? "已完成恢复出厂" : "恢复出厂失败：" + (res.error || ""));
    if (res.ok) { $s("stAuto").checked = false; $s("stCertInfo").textContent = "证书缺失"; }
  } catch (e) { toast("恢复出厂失败: " + e.message); }
};

load();
</script>
