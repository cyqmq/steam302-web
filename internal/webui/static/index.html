<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>steam302-web 控制台</title>
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.5 system-ui, "Segoe UI", sans-serif; background: #16181d; color: #e6e6e6; }
  header { padding: 18px 24px; border-bottom: 1px solid #2a2e37; display: flex; align-items: baseline; gap: 12px; }
  h1 { font-size: 18px; margin: 0; }
  header .sub { color: #8b93a1; font-size: 12px; }
  header button { margin-left: auto; }
  main { max-width: 960px; margin: 0 auto; padding: 20px 24px 60px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: #8b93a1; margin: 26px 0 8px; }
  .card { background: #1d2027; border: 1px solid #2a2e37; border-radius: 10px; padding: 12px 14px; margin-bottom: 8px; display: flex; gap: 12px; align-items: flex-start; }
  .card .meta { flex: 1; min-width: 0; }
  .card .name { font-weight: 600; }
  .card .desc { color: #9aa2b1; font-size: 12px; margin-top: 3px; }
  .card .tags { margin-top: 6px; display: flex; gap: 6px; flex-wrap: wrap; }
  .tag { font-size: 11px; padding: 1px 7px; border-radius: 999px; background: #262b34; color: #9aa2b1; }
  .tag.warn { background: #4a3410; color: #f0b45a; }
  .tag.on { background: #143a24; color: #5fd08a; }
  .tag.off { background: #33262b; color: #d98a8a; }
  input[type=checkbox] { width: 42px; height: 22px; appearance: none; background: #333844; border-radius: 999px; position: relative; cursor: pointer; flex: none; margin-top: 2px; transition: background .15s; }
  input[type=checkbox]::after { content: ""; position: absolute; top: 2px; left: 2px; width: 18px; height: 18px; border-radius: 50%; background: #e6e6e6; transition: transform .15s; }
  input[type=checkbox]:checked { background: #2f7d4f; }
  input[type=checkbox]:checked::after { transform: translateX(20px); }
  button { background: #2b6cb0; color: #fff; border: 0; border-radius: 7px; padding: 7px 14px; cursor: pointer; font-size: 13px; }
  button.ghost { background: #2a2e37; }
  #status { position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%); background: #20242c; border: 1px solid #333844; padding: 8px 16px; border-radius: 8px; font-size: 12px; opacity: 0; transition: opacity .2s; }
  #status.show { opacity: 1; }
</style>
</head>
<body>
<header>
  <h1>steam302-web</h1>
  <span class="sub" id="summary">加载中…</span>
  <button class="ghost" id="regen">重新生成配置</button>
</header>
<main id="app"></main>
<div id="status"></div>
<script>
const app = document.getElementById("app");
const status = document.getElementById("status");
let rules = [];

function toast(msg) {
  status.textContent = msg;
  status.classList.add("show");
  clearTimeout(toast._t);
  toast._t = setTimeout(() => status.classList.remove("show"), 2600);
}

async function api(method, url, body) {
  const res = await fetch(url, {
    method,
    headers: body ? { "Content-Type": "application/json" } : undefined,
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

function render() {
  const groups = {};
  for (const r of rules) (groups[r.group] ||= []).push(r);
  app.innerHTML = "";
  for (const g of Object.keys(groups).sort()) {
    const h = document.createElement("h2");
    h.textContent = g;
    app.appendChild(h);
    for (const r of groups[g]) app.appendChild(card(r));
  }
  const on = rules.filter(r => r.enabled).length;
  document.getElementById("summary").textContent =
    `${rules.length} 条规则，${on} 条启用`;
}

function card(r) {
  const el = document.createElement("div");
  el.className = "card";
  const meta = document.createElement("div");
  meta.className = "meta";
  const tags = [];
  tags.push(`<span class="tag">${r.id}</span>`);
  tags.push(`<span class="tag">${r.host_count} 域名</span>`);
  if (r.missing_files && r.missing_files.length)
    tags.push(`<span class="tag warn">缺文件 ${r.missing_files.length}</span>`);
  meta.innerHTML = `<div class="name">${r.name}</div>
    <div class="desc">${r.description || ""}</div>
    <div class="tags">${tags.join("")}</div>`;
  const cb = document.createElement("input");
  cb.type = "checkbox";
  cb.checked = r.enabled;
  cb.title = r.enabled ? "已启用" : "已关闭";
  cb.onchange = async () => {
    cb.disabled = true;
    try {
      const data = await api("POST", `/api/rules/${r.id}`, { enabled: cb.checked });
      r.enabled = cb.checked;
      const reg = data.regen || {};
      toast(`已${cb.checked ? "启用" : "关闭"} ${r.id}；重生成 ${reg.rules} 条规则，校验 ${reg.validate}`);
      render();
    } catch (e) {
      cb.checked = r.enabled;
      toast("失败: " + e.message);
    } finally {
      cb.disabled = false;
    }
  };
  el.appendChild(meta);
  el.appendChild(cb);
  return el;
}

async function load() {
  try {
    const data = await api("GET", "/api/rules");
    rules = data.rules || [];
    render();
  } catch (e) {
    toast("加载失败: " + e.message);
  }
}

document.getElementById("regen").onclick = async () => {
  try {
    const data = await api("POST", "/api/regen");
    const reg = data.regen || {};
    toast(`已生成 ${reg.rules} 条规则 / ${reg.hosts} 个域名，caddy 校验 ${reg.validate}`);
  } catch (e) {
    toast("失败: " + e.message);
  }
};

load();
</script>
</body>
</html>
